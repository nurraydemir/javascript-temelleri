<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Form Islemleri</title>
</head>
<body>

    <h1>13. Bolum: JavaScript Form Islemleri</h1>

    <h2>2. Formlarda Fonksiyon Kullanimi</h2>
    <button onclick="mesajGoster()">Mesaj Goster</button>
    <p id="mesaj"></p>

    <hr>

    <h2>3. Degisken veya Deger Yazdirma</h2>
    <button onclick="degerYazdir()">Degeri Yazdir</button>
    <p id="degerSonuc"></p>

    <hr>

    <h2>4. Formdan Veri Okuma ve Yazma</h2>
    <input type="text" id="isim" placeholder="Ismini yaz">
    <button onclick="veriOkuYaz()">Selamla</button>
    <p id="veriSonuc"></p>

    <hr>

    <h2>5. Sayinin Karesi</h2>
    <input type="number" id="sayi" placeholder="Bir sayi gir">
    <button onclick="kareHesapla()">Kareyi Hesapla</button>
    <p id="kareSonuc"></p>

    <hr>

    <h2>6. Iki Sayinin Toplami</h2>
    <input type="number" id="sayi1" placeholder="Birinci sayi">
    <input type="number" id="sayi2" placeholder="Ikinci sayi">
    <button onclick="sayilariTopla()">Topla</button>
    <p id="toplamSonuc"></p>

    <hr>

    <h2>7. Kontrollu Kare Hesabi</h2>
    <input type="text" id="kontrolluSayi" placeholder="Bir sayi gir">
    <button onclick="kontrolluKareHesapla()">Hesapla</button>
    <p id="kontrolluSonuc"></p>

    <hr>

    <h2>8. Kullanici Dostu Kare Hesabi</h2>
    <input type="text" id="dostSayi" placeholder="Bir sayi gir">
    <button onclick="kullaniciDostuKare()">Kareyi Hesapla</button>
    <p id="dostSonuc"></p>

    <hr>

    <h2>9. Form Tekrari</h2>
    <input type="number" id="tekrarSayi" placeholder="Bir sayi gir">
    <button onclick="formTekrari()">Hesapla</button>
    <p id="tekrarSonuc"></p>

    <script src="form-islemleri.js"></script>
</body>
</html>
